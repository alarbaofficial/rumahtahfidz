<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Admin Super User - Rumah Tahfidz Al Arba</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-base font-extrabold">Portal Administrasi Utama (Super User)</h1>
            <p class="text-xs text-slate-300">Rumah Tahfidz Al Arba</p>
        </div>
        <button onclick="handleLogout()" class="bg-rose-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold">Keluar</button>
    </header>

    <main class="max-w-7xl mx-auto p-4 w-full space-y-4">
        <!-- METRICS -->
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 text-xs">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <span class="text-slate-500 font-semibold block">Total Santri</span>
                <p class="text-xl font-extrabold text-slate-900" id="stat-total">0 Santri</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <span class="text-slate-500 font-semibold block">Status Infaq Lunas</span>
                <p class="text-xl font-extrabold text-emerald-600" id="stat-infaq">0 Lunas</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm col-span-2 md:col-span-1">
                <span class="text-slate-500 font-semibold block">Akses Sistem</span>
                <p class="text-xs font-extrabold text-slate-800 mt-1">Super User Active</p>
            </div>
        </div>

        <!-- TABEL KELOLA INFAQ -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-extrabold text-sm text-slate-900">Kelola Status Infaq Santri</h3>
                <select id="infaq-periode" onchange="loadInfaq()" class="text-xs p-1.5 border rounded-xl font-bold">
                    <option value="2026-09">Periode: September 2026</option>
                    <option value="2026-10">Periode: Oktober 2026</option>
                    <option value="2026-11">Periode: November 2026</option>
                </select>
            </div>
            <div id="infaq-alert" class="hidden p-2 text-xs font-bold rounded bg-emerald-100 text-emerald-800"></div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border">
                    <thead class="bg-slate-900 text-white">
                        <tr>
                            <th class="p-2 border">ID Santri</th>
                            <th class="p-2 border">Nama Santri</th>
                            <th class="p-2 border">Periode</th>
                            <th class="p-2 border">Status Infaq</th>
                            <th class="p-2 border text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="admin-infaq-body">
                        <tr><td colspan="5" class="p-3 text-center text-slate-400">Memuat catatan infaq...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let santriList = [];
        document.addEventListener('DOMContentLoaded', () => {
            google.script.run.withSuccessHandler(data => {
                santriList = data || [];
                document.getElementById('stat-total').innerText = `${santriList.length} Santri`;
                loadInfaq();
            }).getSantriData('', 'Admin');
        });

        function loadInfaq() {
            const periode = document.getElementById('infaq-periode').value;
            google.script.run.withSuccessHandler(rawInfaq => {
                const tbody = document.getElementById('admin-infaq-body');
                tbody.innerHTML = '';
                let lunasCnt = 0;

                santriList.forEach(s => {
                    const match = (rawInfaq || []).find(i => String(i.idSantri).trim() === String(s.id).trim() && String(i.periode).trim() === periode);
                    const status = match ? match.status : 'Belum Lunas';
                    if (status.toUpperCase() === 'LUNAS') lunasCnt++;

                    tbody.innerHTML += `<tr>
                        <td class="p-2 border font-mono">${s.id}</td>
                        <td class="p-2 border font-bold">${s.nama}</td>
                        <td class="p-2 border">${periode}</td>
                        <td class="p-2 border"><span class="px-2 py-0.5 rounded font-bold ${status.toUpperCase() === 'LUNAS' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${status}</span></td>
                        <td class="p-2 border text-center">
                            ${status.toUpperCase() === 'LUNAS' ? 
                                `<button onclick="updateInfaq('${s.id}', '${periode}', 'Belum Lunas')" class="text-rose-600 font-bold hover:underline">Batalkan Lunas</button>` :
                                `<button onclick="updateInfaq('${s.id}', '${periode}', 'LUNAS')" class="bg-emerald-600 text-white px-2 py-1 rounded font-bold">Tandai LUNAS</button>`
                            }
                        </td>
                    </tr>`;
                });
                document.getElementById('stat-infaq').innerText = `${lunasCnt} Lunas`;
            }).getAllInfaqData();
        }

        function updateInfaq(idSantri, periode, status) {
            google.script.run.withSuccessHandler(res => {
                const box = document.getElementById('infaq-alert');
                box.innerText = res.message;
                box.classList.remove('hidden');
                loadInfaq();
            }).updateInfaqStatus(idSantri, periode, status);
        }

        function handleLogout() {
            sessionStorage.removeItem('userSession');
            let baseUrl = window.location.href.split('?')[0];
            window.location.href = baseUrl + "?page=Homepage";
        }
    </script>
</body>
</html>
